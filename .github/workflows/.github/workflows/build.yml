
name: Build Hail APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Hail-suspend-actions-source.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract source
        run: unzip Hail-suspend-actions-source.zip -d source

      - name: Build APK
        working-directory: source/Hail-main
        run: chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Hail-Suspend-APK
          path: source/Hail-main/app/build/outputs/apk/debug/*.apk
