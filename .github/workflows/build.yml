name: Build Hail APK with tag actions

on:
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4

  - uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'

  - uses: android-actions/setup-android@v3

  - name: Install Android SDK
    run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

  - name: Extract patched source
    run: unzip -q Hail-suspend-actions-source.zip -d source

  - name: Build APK
    working-directory: source/Hail-main
    run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug

  - uses: actions/upload-artifact@v4
    with:
      name: Hail-Suspend-Tag-Actions-APK
      path: source/Hail-main/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
      retention-days: 14
