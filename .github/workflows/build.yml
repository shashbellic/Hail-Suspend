name: Build Hail Suspend Tag Actions

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "::error::Could not locate Android SDK sdkmanager."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Verify patched source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f Hail-suspend-actions-source.zip
          unzip -tq Hail-suspend-actions-source.zip

      - name: Extract patched Hail source
        run: unzip -q Hail-suspend-actions-source.zip -d source

      - name: Confirm tag-action patch is present
        shell: bash
        run: |
          set -euo pipefail
          API_FILE="source/Hail-main/app/src/main/kotlin/com/aistra/hail/app/HailApi.kt"
          grep -q 'ACTION_SUSPEND_TAG' "$API_FILE"
          grep -q 'ACTION_UNSUSPEND_TAG' "$API_FILE"
          grep -q 'ACTION_FORCE_STOP_TAG' "$API_FILE"

      - name: Restore debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: hail-suspend-debug-signing-key-v1

      - name: Create debug signing key if missing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK
        working-directory: source/Hail-main
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Hail-Suspend-Tag-Actions-APK
          path: source/Hail-main/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
